<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-empresa :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <h3>Mis puestos</h3>
    <a th:href="@{/empresa/puestos/publicar}" class="btn btn-dark mb-3">Publicar puesto</a>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Salario</th>
            <th>Activo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="puesto : ${puestos}">
            <td th:text="${puesto.id}"></td>
            <td th:text="${puesto.descripcion}"></td>
            <td th:text="${#numbers.formatCurrency(puesto.salario)}"></td>
            <td>
                <span class="badge bg-success" th:if="${puesto.activo}">Sí</span>
                <span class="badge bg-secondary" th:unless="${puesto.activo}">No</span>
            </td>
            <td class="d-flex gap-1 flex-wrap">
                <form th:if="${puesto.activo}"
                      th:action="@{/empresa/puestos/desactivar/{id}(id=${puesto.id})}"
                      method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Desactivar</button>
                </form>

                <form th:unless="${puesto.activo}"
                      th:action="@{/empresa/puestos/activar/{id}(id=${puesto.id})}"
                      method="post">
                    <button type="submit" class="btn btn-outline-success btn-sm">Activar</button>
                </form>

                <a th:href="@{/empresa/puestos/{id}/candidatos(id=${puesto.id})}"
                   class="btn btn-dark btn-sm">Buscar candidatos</a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(puestos)}">
            <td colspan="5" class="text-muted text-center">No tenés puestos publicados aún.</td>
        </tr>
        </tbody>
    </table>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
