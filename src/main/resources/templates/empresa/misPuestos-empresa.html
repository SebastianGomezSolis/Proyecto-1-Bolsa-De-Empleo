<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/empresa/puestos}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>BolsaEmpleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/empresa/dashboard}" style="font-size:0.9rem;">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/empresa/puestos}" style="font-size:0.9rem;">Mis puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/empresa/puestos/publicar}" style="font-size:0.9rem;">Publicar puesto</a>
                </li>
                <li class="nav-item ms-auto d-flex align-items-center me-2">
                    <span class="text-white me-3" style="font-size:0.9rem;" th:text="${empresa.correo}">usuario@correo.com</span>
                    <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <h3>Mis puestos</h3>
    <a th:href="@{/empresa/puestos/publicar}" class="btn btn-dark mb-3">Publicar puesto</a>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Salario</th>
            <th>Activo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="puesto : ${puestos}">
            <td th:text="${puesto.id}"></td>
            <td th:text="${puesto.descripcion}"></td>
            <td th:text="${puesto.salario}"></td>
            <td>
                <span class="badge bg-success" th:if="${puesto.activo}">Sí</span>
                <span class="badge bg-secondary" th:unless="${puesto.activo}">No</span>
            </td>
            <td>
                <form th:action="@{/empresa/puestos/desactivar/{id}(id=${puesto.id})}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-dark btn-sm"
                            th:disabled="${!puesto.activo}">Desactivar</button>
                </form>
                <a th:href="@{/empresa/puestos/{id}/candidatos(id=${puesto.id})}"
                   class="btn btn-dark btn-sm ms-1">Buscar candidatos</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
