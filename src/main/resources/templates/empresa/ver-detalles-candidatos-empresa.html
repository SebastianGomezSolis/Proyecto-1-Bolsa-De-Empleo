<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-empresa :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">

    <h3>Detalle de oferente</h3>

    <!-- Datos del oferente -->
    <div class="border rounded p-3 mb-4">
        <h5 th:text="${oferente.nombre} + ' ' + ${oferente.primerApellido}"></h5>
        <p class="mb-1"><strong>Identificación:</strong> <span th:text="${oferente.identificacion}"></span></p>
        <p class="mb-1"><strong>Email:</strong> <span th:text="${oferente.correo}"></span></p>
        <p class="mb-1"><strong>Teléfono:</strong> <span th:text="${oferente.telefono}"></span></p>
        <p class="mb-1"><strong>Residencia:</strong> <span th:text="${oferente.lugarResidencia}"></span></p>
        <div th:if="${oferente.curriculum != null}" class="mt-2">
            <a th:href="@{'/uploads/curriculos/' + ${oferente.identificacion} + '.pdf'}"
               target="_blank" class="btn btn-dark btn-sm">Ver CV</a>
        </div>
    </div>

    <!-- Habilidades -->
    <h5>Habilidades</h5>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>Característica</th>
            <th>Nivel</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${habilidades}">
            <td th:text="${h.caracteristica.nombre}"></td>
            <td th:text="${h.nivel}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(habilidades)}">
            <td colspan="2" class="text-muted">No tiene habilidades registradas.</td>
        </tr>
        </tbody>
    </table>

    <a href="javascript:history.back()" class="btn btn-dark btn-sm">Volver</a>

</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
