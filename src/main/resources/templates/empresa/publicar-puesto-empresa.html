<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/empresa/puestos/publicar}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>BolsaEmpleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/empresa/dashboard}" style="font-size:0.9rem;">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/empresa/puestos}" style="font-size:0.9rem;">Mis puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/empresa/puestos/publicar}" style="font-size:0.9rem;">Publicar puesto</a>
                </li>
                <li class="nav-item ms-auto d-flex align-items-center me-2">
                    <span class="text-white me-3" style="font-size:0.9rem;" th:text="${empresa.correo}">usuario@correo.com</span>
                    <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1" style="max-width: 750px;">

    <h3 class="mb-4">Publicar puesto</h3>

    <!-- Mensaje de error en vista -->
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/empresa/puestos/publicar}" method="post">

        <!-- Descripción -->
        <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold">Descripción del puesto</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="4"
                      placeholder="Describa el puesto y sus responsabilidades..." required></textarea>
        </div>

        <!-- Salario -->
        <div class="mb-3">
            <label for="salario" class="form-label fw-semibold">Salario ($)</label>
            <input type="number" id="salario" name="salario" class="form-control"
                   placeholder="Ej: 856100" min="0" step="any" required />
        </div>

        <!-- Tipo de publicación -->
        <div class="mb-4">
            <label class="form-label fw-semibold">Tipo de publicación</label>
            <div class="d-flex gap-4">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipoPublicacion"
                           id="tipoPublico" value="publico" checked />
                    <label class="form-check-label" for="tipoPublico">
                        Público <span class="text-muted" style="font-size:0.85rem;">(visible para todos)</span>
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipoPublicacion"
                           id="tipoPrivado" value="privado" />
                    <label class="form-check-label" for="tipoPrivado">
                        Privado <span class="text-muted" style="font-size:0.85rem;">(solo usuarios registrados)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Características requeridas -->
        <div class="mb-4">
            <label class="form-label fw-semibold">Características requeridas</label>
            <p class="text-muted" style="font-size:0.85rem;">
                Seleccione las características y el nivel mínimo requerido (1 = básico, 5 = experto).
            </p>

            <div th:each="raiz : ${raices}" class="mb-3">
                <div class="border rounded">
                    <div class="bg-secondary bg-opacity-10 px-3 py-2 fw-semibold"
                         style="font-size:0.95rem;"
                         th:text="${raiz.nombre}"></div>

                    <div class="px-3 py-2">
                        <div th:each="hijo : ${raiz.hijos}" class="mb-2">

                            <!-- Si el hijo es hoja -->
                            <div th:if="${hijo.isHoja()}" class="d-flex align-items-center gap-3">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="caracteristicaIds"
                                       th:id="'car_' + ${hijo.id}"
                                       th:value="${hijo.id}" />

                                <label class="form-check-label flex-grow-1"
                                       th:for="'car_' + ${hijo.id}"
                                       th:text="${hijo.nombre}"></label>

                                <div class="d-flex align-items-center gap-1">
                                    <label class="text-muted mb-0" style="font-size:0.8rem;">Nivel:</label>
                                    <select class="form-select form-select-sm"
                                            style="width:70px;"
                                            th:name="'nivel_' + ${hijo.id}">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Si el hijo tiene subcategorías -->
                            <div th:unless="${hijo.isHoja()}">
                                <div class="fw-semibold text-secondary mb-1"
                                     style="font-size:0.88rem;"
                                     th:text="${hijo.nombre}"></div>

                                <div th:each="nieto : ${hijo.hijos}"
                                     class="d-flex align-items-center gap-3 ms-3 mb-1">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="caracteristicaIds"
                                           th:id="'car_' + ${nieto.id}"
                                           th:value="${nieto.id}" />

                                    <label class="form-check-label flex-grow-1"
                                           th:for="'car_' + ${nieto.id}"
                                           th:text="${nieto.nombre}"></label>

                                    <div class="d-flex align-items-center gap-1">
                                        <label class="text-muted mb-0" style="font-size:0.8rem;">Nivel:</label>
                                        <select class="form-select form-select-sm"
                                                style="width:70px;"
                                                th:name="'nivel_' + ${nieto.id}">
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Publicar puesto</button>
            <a th:href="@{/empresa/puestos}" class="btn btn-outline-dark">Cancelar</a>
        </div>

    </form>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
