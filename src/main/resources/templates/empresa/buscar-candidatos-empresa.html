<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-empresa :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <h3>Candidatos para el puesto</h3>
    <p><strong>Puesto:</strong> <span th:text="${puesto.descripcion}"></span></p>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Oferente</th>
            <th>Requisitos cumplidos</th>
            <th>% Coincidencia</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${candidatos}">
            <td th:text="${c.oferente.nombre} + ' ' + ${c.oferente.primerApellido}"></td>
            <td th:text="${c.requisitosCumplidos} + ' / ' + ${c.totalRequisitos}"></td>
            <td th:text="${#numbers.formatDecimal(c.porcentaje, 1, 2)} + '%'"></td>
            <td>
                <a th:href="@{/empresa/candidatos/{id}(id=${c.oferente.identificacion}, puestoId=${puesto.id})}"
                   class="btn btn-outline-dark btn-sm">Ver detalle</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(candidatos)}">
            <td colspan="4" class="text-center text-muted">No se encontraron candidatos.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/empresa/puestos}" class="btn btn-dark btn-sm">Volver</a>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
