<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/oferente/habilidades}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>BolsaEmpleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/oferente/dashboard}" style="font-size:0.9rem;">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/oferente/habilidades}" style="font-size:0.9rem;">Mis habilidades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/oferente/cv}" style="font-size:0.9rem;">Mi CV</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/puestos/buscar}" style="font-size:0.9rem;">Buscar puesto</a>
                </li>
                <li class="nav-item ms-auto d-flex align-items-center me-2">
                    <span class="text-white me-3" style="font-size:0.9rem;" th:text="${oferente.correo}">usuario@correo.com</span>
                    <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <h3 class="mb-4">Mis habilidades</h3>

    <div class="row g-4">

        <!-- Columna izquierda: tabla habilidades -->
        <div class="col-md-4">
            <table class="table table-hover table-sm">
                <thead>
                <tr>
                    <th>Característica</th>
                    <th>Nivel</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${habilidades}">
                    <td th:text="${h.caracteristica.nombre}"></td>
                    <td th:text="${h.nivel}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(habilidades)}">
                    <td colspan="2" class="text-muted text-center">Sin habilidades.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Columna central: navegador jerárquico -->
        <div class="col-md-4">

            <!-- Ruta de navegación -->
            <div class="mb-2">
                <span class="fw-semibold">Ruta:</span>
                <span class="ms-1">
                    <a th:href="@{/oferente/habilidades}" class="badge text-bg-secondary text-decoration-none">Raíces</a>
                    <span th:each="nodo : ${ruta}">
                        <span class="text-muted mx-1">/</span>
                        <a th:href="@{/oferente/habilidades(actualId=${nodo.id})}"
                           class="badge text-bg-secondary text-decoration-none"
                           th:text="${nodo.nombre}"></a>
                    </span>
                </span>
            </div>

            <!-- Título del nodo actual -->
            <div th:if="${actual != null}" class="mb-2 text-muted" style="font-size:0.9rem;">
                Subcategorías de: <strong th:text="${actual.nombre}"></strong>
            </div>

            <!-- Listado de subcategorías -->
            <div th:each="sub : ${subcategorias}"
                 class="d-flex justify-content-between align-items-center border rounded px-3 py-2 mb-2 bg-white">
                <span th:text="${sub.nombre}"></span>
                <!-- Si es hoja: botón para agregar directamente -->
                <a th:if="${sub.isHoja()}"
                   th:href="@{/oferente/habilidades(actualId=${actual != null ? actual.id : null}, selId=${sub.id})}"
                   class="btn btn-dark btn-sm">Selec.</a>
                <!-- Si tiene hijos: botón para entrar -->
                <a th:unless="${sub.isHoja()}"
                   th:href="@{/oferente/habilidades(actualId=${sub.id})}"
                   class="btn btn-outline-secondary btn-sm">Entrar</a>
            </div>

            <div th:if="${#lists.isEmpty(subcategorias)}" class="text-muted" style="font-size:0.9rem;">
                No hay subcategorías.
            </div>
        </div>

        <!-- Columna derecha: formulario agregar -->
        <div class="col-md-4">
            <div class="border rounded p-3 bg-white">
                <h6 class="fw-bold mb-3">Agregar Habilidad</h6>

                <form th:action="@{/oferente/habilidades/agregar}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Característica</label>
                        <!-- Dropdown solo con hojas del nivel actual -->
                        <select name="caracteristicaId" class="form-select" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <th:block th:each="sub : ${subcategorias}">
                                <option th:if="${sub.isHoja()}"
                                        th:value="${sub.id}"
                                        th:text="${sub.nombre}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="nivel" class="form-label">Nivel (1-5)</label>
                        <input type="number" id="nivel" name="nivel"
                               class="form-control" min="1" max="5" value="1" required />
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Agregar</button>
                </form>
            </div>
        </div>

    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
