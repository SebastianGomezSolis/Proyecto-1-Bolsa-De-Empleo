<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-oferente :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1" style="max-width: 600px;">
    <h3 class="mb-4">Mi CV</h3>
    <div th:if="${error}" class="alert alert-danger" style="max-width: 450px;" th:text="${error}"></div>

    <div class="d-flex gap-2 mb-4">

        <a th:if="${oferente.curriculum != null}" th:href="@{'/uploads/curriculos/' + ${oferente.identificacion} + '.pdf'}"
           target="_blank" class="btn btn-dark">Ver CV</a>

        <span th:if="${oferente.curriculum == null}" class="btn btn-dark disabled">Ver CV</span>

        <a th:href="@{/oferente/cv(subir=true)}" class="btn btn-dark">Subir CV</a>
    </div>

    <div th:if="${oferente.curriculum == null and !mostrarSubir}" class="alert alert-warning" style="max-width: 450px;">
        Aún no tenés un CV subido. Presioná <strong>Subir CV</strong> para agregar uno.
    </div>

    <div th:if="${oferente.curriculum != null and !mostrarSubir}" class="alert alert-success" style="max-width: 450px;">
        Ya tenés un CV subido. Podés verlo o reemplazarlo cuando quieras.
    </div>

    <div th:if="${mostrarSubir}" class="border rounded p-4 bg-white" style="max-width: 450px;">
        <h5 class="mb-3">Subir nuevo CV</h5>
        <p class="text-muted" style="font-size:0.88rem;">
            Solo se aceptan archivos <strong>PDF</strong>. Si ya tienes uno subido, será reemplazado.
        </p>
        <form th:action="@{/oferente/cv/subir}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="archivo" class="form-label fw-semibold">Archivo PDF</label>
                <input type="file" id="archivo" name="archivo"
                       class="form-control" accept="application/pdf" required />
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">Subir</button>
                <a th:href="@{/oferente/cv}" class="btn btn-outline-dark">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
