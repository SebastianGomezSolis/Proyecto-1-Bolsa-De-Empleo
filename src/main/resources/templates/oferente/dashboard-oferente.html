<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/oferente/dashboard}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>BolsaEmpleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/oferente/dashboard}" style="font-size:0.9rem;">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/oferente/habilidades}" style="font-size:0.9rem;">Mis habilidades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/oferente/cv}" style="font-size:0.9rem;">Mi CV</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/puestos/buscar}" style="font-size:0.9rem;">Buscar puesto</a>
                </li>
                <li class="nav-item ms-auto d-flex align-items-center me-2">
                    <span class="text-white me-3" style="font-size:0.9rem;" th:text="${oferente.correo}">usuario@correo.com</span>
                    <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
                </li>
            </ul>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <h3>Oferente - Dashboard</h3>
        <p class="text-muted">Administra tus habilidades y tu CV.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a th:href="@{/oferente/habilidades}" class="btn btn-dark">Mis habilidades</a>
            <a th:href="@{/oferente/cv}" class="btn btn-dark">Mi CV</a>
            <a th:href="@{/puestos/buscar}" class="btn btn-dark">Buscar puesto</a>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
