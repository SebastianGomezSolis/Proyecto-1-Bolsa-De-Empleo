<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-administrador :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <h3 class="mb-4">Empresas pendientes</h3>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>Correo</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.correo}" class="align-middle"></td>
            <td>
                <form th:action="@{/admin/empresas/autorizar/{id}(id=${empresa.id})}" method="post">
                    <button type="submit" class="btn btn-success btn-sm">Aprobar y generar clave</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(empresas)}">
            <td colspan="2" class="text-muted text-center">No hay empresas pendientes de aprobación.</td>
        </tr>
        </tbody>
    </table>

</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
