<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-administrador :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">

    <h3 class="mb-1">Reportes</h3>
    <p class="text-muted mb-4" style="font-size:0.9rem;">
        Generá reportes de puestos publicados por mes y año en formato PDF.
    </p>

    <div class="border rounded p-4 bg-white" style="max-width: 450px;">
        <h6 class="fw-bold mb-3">Reporte de puestos por mes</h6>
        <p class="text-muted mb-3" style="font-size:0.88rem;">
            Seleccione el mes y el año para descargar el reporte en PDF con todos los puestos publicados en ese período.
        </p>

        <form th:action="@{/admin/reportes/pdf}" method="get" target="_blank">
            <div class="row g-3 mb-3">

                <!-- Mes -->
                <div class="col">
                    <label for="mes" class="form-label fw-semibold">Mes</label>
                    <select id="mes" name="mes" class="form-select" required>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>

                <!-- Año -->
                <div class="col">
                    <label for="anio" class="form-label fw-semibold">Año</label>
                    <input type="number" id="anio" name="anio"
                           class="form-control" value="2026"
                           min="2020" max="2099" required />
                </div>

            </div>

            <button type="submit" class="btn btn-dark">
                Ver PDF
            </button>
        </form>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
