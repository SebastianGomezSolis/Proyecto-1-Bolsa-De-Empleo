<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/admin/oferentes/pendientes}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>BolsaEmpleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}" style="font-size:0.9rem;">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/empresas/pendientes}" style="font-size:0.9rem;">Empresas pendientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/oferentes/pendientes}" style="font-size:0.9rem;">Oferentes pendientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/caracteristicas}" style="font-size:0.9rem;">Características</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/reportes}" style="font-size:0.9rem;">Reportes</a>
                </li>
                <li class="nav-item ms-auto d-flex align-items-center me-2">
                    <span class="text-white me-3" style="font-size:0.9rem;" th:text="${admin.correo}">usuario@correo.com</span>
                    <a th:href="@{/salir}" class="btn btn-outline-light btn-sm">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">

    <h3 class="mb-4">Oferentes pendientes</h3>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Usuario</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="oferente : ${oferentes}">
            <td class="align-middle"
                th:text="${oferente.nombre + ' ' + oferente.primerApellido}"></td>
            <td class="align-middle"
                th:text="${oferente.correo}"></td>
            <td>
                <form th:action="@{/admin/oferentes/autorizar/{id}(id=${oferente.identificacion})}"
                      method="post">
                    <button type="submit" class="btn btn-success btn-sm">Aprobar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(oferentes)}">
            <td colspan="3" class="text-muted text-center">No hay oferentes pendientes de aprobación.</td>
        </tr>
        </tbody>
    </table>

</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
