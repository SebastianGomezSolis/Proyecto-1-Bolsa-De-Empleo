<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Registro Oferente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Logo" style="height:28px; width:auto; margin-right:8px;" />
                <span>Bolsa de Empleo</span>
            </a>
            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/puestos/buscar}" style="font-size:0.9rem;">Buscar puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/registro/empresa}" style="font-size:0.9rem;">Registro Empresa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/registro/oferente}" style="font-size:0.9rem;">Registro Oferente</a>
                </li>
                <li class="nav-item ms-auto me-3">
                    <a class="nav-link" th:href="@{/login}" style="font-size:0.9rem;">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h4 class="mb-4">Registro de Oferente</h4>

                    <!-- Mensaje de error -->
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <!-- Mensaje de éxito -->
                    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>

                    <form th:action="@{/registro/oferente}" th:object="${oferente}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Identificación</label>
                            <input type="text" class="form-control" th:field="*{identificacion}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Primer apellido</label>
                            <input type="text" class="form-control" th:field="*{primerApellido}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nacionalidad</label>
                            <input type="text" class="form-control" th:field="*{nacionalidad}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" th:field="*{correo}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lugar de residencia</label>
                            <input type="text" class="form-control" th:field="*{lugarResidencia}" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{clave}" required />
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white p-3 mt-auto" style="font-size: 0.9rem;">
    <div class="container d-flex justify-content-between">
        <div><b>Bolsa de Empleo</b><br>Total Soft Inc.</div>
        <div>Contacto: info@bolsaempleo.local<br>Créditos: Equipo de desarrollo</div>
    </div>
</footer>

</body>
</html>
