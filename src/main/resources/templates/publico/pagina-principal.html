<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-publico :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">

    <h2>Bolsa de Empleo</h2>
    <p class="text-muted">Últimos 5 puestos públicos</p>

    <div class="row g-3 align-items-start">

        <div class="col-md-4" th:each="puesto, iterStat : ${puestos}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">

                    <!-- Empresa y descripción -->
                    <h6 class="fw-bold mb-0" th:text="${puesto.empresa.nombre}">Empresa</h6>
                    <p class="text-muted mb-2" th:text="${puesto.descripcion}">Descripción</p>

                    <!-- Salario -->
                    <p>
                        <strong>Salario:</strong>
                        $<span th:text="${#numbers.formatDecimal(puesto.salario, 1, 2)}"></span>
                        /
                        ₡<span th:text="${#numbers.formatDecimal(puesto.salario * tipoCambio.venta, 1, 0)}"></span>
                    </p>

                    <!-- Botón que despliega las características al hacer clic -->
                    <div class="mt-auto">
                        <a class="btn btn-outline-dark w-100"
                           data-bs-toggle="collapse"
                           th:href="'#detalle-' + ${iterStat.index}"
                           role="button">
                            Ver detalle
                        </a>

                        <!-- Características del puesto (se despliegan al hacer clic) -->
                        <div class="collapse mt-2 border rounded p-2 bg-white"
                             th:id="'detalle-' + ${iterStat.index}">
                            <p class="fw-bold mb-1" th:text="${puesto.descripcion}">Puesto</p>
                            <ul class="mb-0">
                                <li th:each="pc : ${puesto.caracteristicas}"
                                    th:text="${pc.caracteristica.nombre} + ' (nivel ' + ${pc.nivelRequerido} + ')'">
                                </li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Mensaje si no hay puestos -->
        <div class="col-12" th:if="${#lists.isEmpty(puestos)}">
            <p class="text-muted">No hay puestos públicos registrados aún.</p>
        </div>

    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
