<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-publico :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <h4 class="mb-4">Registro de Empresa</h4>
                        <img th:src="@{/images/empresas.png}" alt="Imagen de registro" class="img-fluid" style="max-width: 100px;">
                    </div>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>

                    <form th:action="@{/empresa/registro}" th:object="${empresa}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Localización</label>
                            <input type="text" class="form-control" th:field="*{localizacion}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" th:field="*{correo}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{clave}" required />
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
