<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid p-0">
        <div class="d-flex align-items-center w-100">
            <a class="navbar-brand mb-0 h1 px-2 d-flex align-items-center" th:href="@{/}" style="font-size:1.1rem;">
                <img th:src="@{/images/bolsaEmpleo.png}" alt="Bolsa de Empleo" style="height:28px; width:auto; margin-right:8px;" />
                <span>Bolsa de Empleo</span>
            </a>

            <ul class="navbar-nav flex-row" style="gap: 1.5rem; margin-left: 1rem; width: 100%;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/puestos/buscar}" style="font-size:0.9rem;">Buscar puestos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/registro/empresa}" style="font-size:0.9rem;">Registro Empresa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/registro/oferente}" style="font-size:0.9rem;">Registro Oferente</a>
                </li>
                <li class="nav-item ms-auto me-3">
                    <a class="nav-link active" th:href="@{/ingresar}" style="font-size:0.9rem;">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <!-- Título y icono -->
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-tie" style="color: rgb(0, 0, 0); font-size: 3rem;"></i>
                        <h2 class="mt-3">Login</h2>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <!-- Formulario -->
                    <form th:action="@{/ingresar}" method="post">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="email" class="form-control" id="usuario" name="correo" placeholder="wrbcaft@rtcry.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="clave" name="clave" placeholder="••••••••" required>
                        </div>

                        <center>
                            <button type="submit" class="btn btn-dark" id="butonLogin">Enviar</button>
                        </center>
                    </form>

                    <!-- Enlaces adicionales -->
                    <div class="text-center mt-4">
                        <small class="text-dark">
                            ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
