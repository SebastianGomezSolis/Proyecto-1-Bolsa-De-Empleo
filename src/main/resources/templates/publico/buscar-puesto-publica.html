<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- HEAD -->
<div th:replace="fragmentos/head :: head"></div>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAV -->
<div th:replace="fragmentos/navbar-publico :: nav"></div>

<!-- MAIN -->
<main class="container my-4 flex-grow-1">

    <div class="card p-3 mb-4">
        <h5 class="mb-3">Buscar puestos por características</h5>

        <!-- Formulario de búsqueda -->
        <form th:action="@{/puestos/buscar}" method="get">

            <!-- Lista de características con checkboxes jerárquica -->
            <div class="border rounded p-3 mb-3" style="max-height: 300px; overflow-y: auto;">
                <th:block th:each="raiz : ${caracteristicas}" th:if="${raiz.raiz}">

                    <!-- Categoría raíz -->
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               th:id="'car-' + ${raiz.id}"
                               name="caracteristicaIds"
                               th:value="${raiz.id}" />
                        <label class="form-check-label fw-semibold"
                               th:for="'car-' + ${raiz.id}"
                               th:text="${raiz.nombre}">Categoría</label>
                    </div>

                    <!-- Hijos de la categoría -->
                    <div class="ms-4" th:each="hijo : ${raiz.hijos}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   th:id="'car-' + ${hijo.id}"
                                   name="caracteristicaIds"
                                   th:value="${hijo.id}" />
                            <label class="form-check-label"
                                   th:for="'car-' + ${hijo.id}"
                                   th:text="${hijo.nombre}">Hijo</label>
                        </div>

                        <!-- Nietos (tercer nivel) -->
                        <div class="ms-4" th:each="nieto : ${hijo.hijos}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:id="'car-' + ${nieto.id}"
                                       name="caracteristicaIds"
                                       th:value="${nieto.id}" />
                                <label class="form-check-label"
                                       th:for="'car-' + ${nieto.id}"
                                       th:text="${nieto.nombre}">Nieto</label>
                            </div>
                        </div>
                    </div>

                </th:block>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a class="btn btn-secondary ms-2" th:href="@{/puestos/buscar}">Limpiar</a>
        </form>
    </div>

    <!-- Resultados -->
    <h5>Resultados</h5>
    <div class="row g-3">
        <div class="col-md-4" th:each="puesto : ${puestos}">
            <div class="card">
                <div class="card-body">
                    <h6 class="fw-bold" th:text="${puesto.empresa.nombre}">Empresa</h6>
                    <p class="mb-1" th:text="${puesto.descripcion}">Descripción</p>
                    <p class="fw-bold mb-0">
                        $<span th:text="${#numbers.formatDecimal(puesto.salario, 1, 2)}"></span>
                        /
                        ₡<span th:text="${tipoCambio != null ? #numbers.formatDecimal(puesto.salario * tipoCambio.venta, 1, 0) : 'No disponible'}"></span>
                    </p>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(puestos)}">
            <p class="text-muted">No se encontraron puestos.</p>
        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="fragmentos/footer :: footer"></div>

</body>
</html>
